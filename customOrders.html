<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pedidos Personalizados - Puertas y Muebles</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800">

  <!-- Encabezado -->
  <header class="bg-white shadow p-4 text-center font-semibold text-xl">
    Pedidos Personalizados de Muebles
  </header>

  <!-- Sección de Introducción -->
  <section class="max-w-3xl mx-auto px-4 py-8 text-center">
    <h2 class="text-3xl font-bold mb-4">Tu Visión, Nuestra Artesanía</h2>
    <p class="text-gray-600">
      ¿Necesitas algo único? Completa el siguiente formulario y construyamos la puerta, mesa o mueble perfecto para tu espacio.
    </p>
  </section>

  <!-- Sección del Formulario -->
  <section class="max-w-3xl mx-auto bg-white p-8 shadow-lg rounded-md">
    <form id="customOrderForm" class="space-y-6">

      <div>
        <label class="block font-medium">Nombre Completo</label>
        <input type="text" name="name" required class="mt-1 w-full border rounded px-4 py-2 focus:ring-2 ring-black" />
      </div>

      <div>
        <label class="block font-medium">Correo Electrónico</label>
        <input type="email" name="email" required class="mt-1 w-full border rounded px-4 py-2 focus:ring-2 ring-black" />
      </div>

      <div>
        <label class="block font-medium">Número de Teléfono</label>
        <input type="tel" name="phone" class="mt-1 w-full border rounded px-4 py-2 focus:ring-2 ring-black" />
      </div>

      <div>
        <label class="block font-medium">Tipo de Mueble</label>
        <select name="type" required class="mt-1 w-full border rounded px-4 py-2 focus:ring-2 ring-black">
          <option value="">-- Seleccione --</option>
          <option value="door">Puerta</option>
          <option value="table">Mesa</option>
          <option value="chair">Silla</option>
          <option value="bed">Base para Cama</option>
          <option value="wardrobe">Armario</option>
          <option value="other">Otro</option>
        </select>
      </div>

      <div>
        <label class="block font-medium">Dimensiones o Preferencias</label>
        <input type="text" name="dimensions" placeholder="Ejemplo: 1.80 m x 0.90 m, madera de teca" class="mt-1 w-full border rounded px-4 py-2 focus:ring-2 ring-black" />
      </div>

      <div>
        <label class="block font-medium">Subir Boceto (Opcional)</label>
        <input type="file" name="sketch" accept="image/*" class="mt-1 w-full border rounded px-4 py-2" />
      </div>

      <div>
        <label class="block font-medium">Detalles Adicionales</label>
        <textarea name="message" rows="4" placeholder="Cuéntanos más sobre tu pedido personalizado..." class="mt-1 w-full border rounded px-4 py-2 focus:ring-2 ring-black"></textarea>
      </div>

      <div>
        <button type="submit" class="w-full bg-black text-white py-3 rounded hover:bg-gray-800 transition">
          Enviar Pedido Personalizado
        </button>
      </div>

      <p id="confirmationMsg" class="text-green-600 text-center hidden">
        ¡Gracias! Tu solicitud ha sido enviada correctamente.
      </p>

    </form>
  </section>

  <!-- JavaScript para la confirmación -->
  <script>
    document.getElementById('customOrderForm').addEventListener('submit', function (e) {
      e.preventDefault();
      document.getElementById('confirmationMsg').classList.remove('hidden');
      this.reset();
    });
  </script>

</body>
</html>
